name: Publish Web SDK to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SDK version to publish"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish verified tarball
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test -f "meshstream-p2p-web-${VERSION}.tgz"
          npm publish "meshstream-p2p-web-${VERSION}.tgz" --access public --registry https://registry.npmjs.org/
